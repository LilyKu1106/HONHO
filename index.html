<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>HONHO FACTORY QUEST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout concept: a product tracker on top, one factory "window" per step, a quiet SOP panel below.
   One committed look: night-shift foundry, molten orange against steel blue. */
:root{
  --bg:#0f141a; --panel:#18202a; --panel2:#202b38; --line:#2c394a;
  --fg:#e8edf2; --muted:#93a1b3;
  --ember:#ff7a1a; --ember2:#ffb15c; --alu:#cfd8e1; --cyan:#38c9dc;
  --ok:#4fd08a; --bad:#ff5d5d; --hue:#38c9dc;
  --f-display:"Barlow Condensed","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[data-l]{display:none}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,.dgi:focus-visible,.cwp:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand>div{min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:clamp(14px,3.9vw,22px);letter-spacing:.04em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:transparent;border:0;padding:6px 12px;font-size:13px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--panel2);color:var(--fg)}

.rail{display:grid;grid-template-columns:repeat(19,1fr);gap:3px}
.seg{height:6px;border-radius:2px;background:var(--line)}
.seg.done{background:var(--c)}
.seg.cur{background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--c);animation:blink 1.4s infinite}
.railinfo{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.railinfo b{color:var(--hue);font-weight:500}

.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px}
.tn{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.4;position:relative;min-width:0;padding:2px}
.tn svg,.tn img{width:clamp(28px,7vw,42px);height:auto}
.tn small{font-size:10px;line-height:1.2;text-align:center;color:var(--muted)}
.tn.done{opacity:.85}
.tn.cur{opacity:1}
.tn.cur small{color:var(--hue);font-weight:700}
.tn.cur::after{content:"";position:absolute;inset:-2px;border:1.5px solid var(--hue);border-radius:8px;pointer-events:none}
.tn.pop svg{animation:popin .7s}

.scene{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#141b23;
  height:clamp(400px,56vw + 140px,560px);animation:enter .4s ease both}
.scene>.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene>.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;--u:clamp(110px,28vw,190px)}
.scene.flash::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(79,208,138,.28),transparent 65%);animation:fl .8s ease-out forwards;pointer-events:none}
.scene.shake .play{animation:shake .35s}
.statepop{position:absolute;top:10px;right:10px;z-index:6;display:flex;align-items:center;gap:10px;background:rgba(15,20,26,.88);border:1px solid var(--ok);border-radius:12px;padding:6px 12px 6px 6px;pointer-events:none;animation:sp 2s ease forwards}
.statepop svg,.statepop img{width:54px;height:54px}
.statepop small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--ok);letter-spacing:.06em}
.statepop b{font-size:13px;font-weight:500}

.obj{position:relative;width:var(--u);aspect-ratio:1;max-width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.obj svg,.obj img{width:100%;height:100%;display:block}
.obj .ico{position:absolute;inset:0}
.obj .l0,.obj .l1{position:absolute;inset:0}
.obj.run{animation:wig .25s infinite alternate}
.obj.big{--u:clamp(200px,62vw,290px)}
.hot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--hue);background:rgba(15,20,26,.55);padding:0;animation:pulse 1.6s infinite}
.hot.on{background:var(--ok);border-color:var(--ok);animation:none}
.hot.on::after{content:"✓";color:#06210f;font-weight:700;font-size:16px;line-height:26px;display:block;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:28px;max-width:560px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(79,208,138,.16);color:var(--ok);border:1px solid rgba(79,208,138,.4)}
.chip.off{background:transparent;color:var(--muted);border-color:var(--line)}
.cap{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;max-width:520px}
.cap.tag{color:var(--ember2)}

.bar{width:min(320px,80%);height:10px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--ember2))}
.btn{background:var(--ember);color:#1a0f06;border:0;border-radius:10px;padding:11px 22px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.06em;min-height:46px}
.btn:hover{background:var(--ember2)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.holdbtn{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--panel2);border:2px solid var(--ember);color:var(--fg);border-radius:99px;padding:12px 30px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;min-height:52px}
.holdbtn:active{background:var(--ember);color:#1a0f06}
.tapobj{background:transparent;border:0;padding:0;width:var(--u);aspect-ratio:1;touch-action:manipulation}
.tapobj svg,.tapobj img{width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.tapobj.bump{animation:bump .18s}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;width:min(620px,100%)}
.card{background:rgba(24,32,42,.94);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.card svg,.card img{width:clamp(44px,13vw,70px);height:auto}
.card b{font-size:13px;font-weight:500;line-height:1.35}
.card small{font-family:var(--f-mono);font-size:11px;color:var(--muted);line-height:1.3}
.card:hover{border-color:var(--hue)}
.card.ok{border-color:var(--ok);background:rgba(79,208,138,.14)}
.card.bad{border-color:var(--bad);background:rgba(255,93,93,.12);animation:shake .35s}
.card[disabled]{cursor:default}
.hdr svg,.hdr img{width:clamp(56px,16vw,92px);height:auto}
.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:620px}
.stepchip{display:flex;align-items:center;gap:8px;background:rgba(24,32,42,.94);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;text-align:left}
.stepchip svg,.stepchip img{width:34px;height:34px;flex:none}
.stepchip .no{font-family:var(--f-mono);color:var(--ok);width:1.2em;text-align:center}
.stepchip.ok{border-color:var(--ok);opacity:.8}
.stepchip.bad{border-color:var(--bad);animation:shake .35s}
.dial{width:min(300px,76%);height:auto}
.rg{width:min(300px,76%);accent-color:var(--ember);height:28px}

/* drag & drop */
.dz{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,3vw,30px);width:100%;max-width:560px}
.dz-src{display:flex;gap:8px;justify-content:center;min-width:0}
.dgi{width:clamp(52px,15vw,92px);aspect-ratio:1;touch-action:none;cursor:grab;position:relative;z-index:3;transition:transform .28s,opacity .28s;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.dgi.dragging{transition:none;cursor:grabbing;z-index:9}
.dgi svg,.dgi img{width:100%;height:100%;pointer-events:none;display:block}
.dz-tgt{position:relative;width:clamp(96px,28vw,170px);aspect-ratio:1;border:2px dashed var(--hue);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,20,26,.55);animation:pulse 1.8s infinite}
.dz-tgt.over{background:rgba(56,201,220,.2)}
.tgi{width:76%;transition:transform 1.3s ease-in,filter .4s}
.tgi svg,.tgi img{width:100%;height:auto;display:block}
.tgi.hot{filter:drop-shadow(0 0 16px #ff7a1a) brightness(1.2);animation:glow 1s ease-in-out infinite}
.tgi.busy{filter:drop-shadow(0 0 14px #38c9dc) brightness(1.15);animation:wig .25s infinite alternate}
.tgi.drive{transform:translateX(160%)}
.tgl{font-size:11px;color:var(--muted);text-align:center;line-height:1.2;padding:0 4px}
.dz-arrow{color:var(--hue);font-size:22px}

/* cnc */
.cnc{position:relative;width:min(100%,430px);aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:rgba(10,15,20,.6);border:1px solid var(--line)}
.cnc>svg.m{position:absolute;inset:0;width:100%;height:100%}
.ctg{position:absolute;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px dashed var(--hue);border-radius:10px;pointer-events:none;animation:pulse 1.6s infinite}
.ctg.over{background:rgba(56,201,220,.2)}
.cwp{position:absolute;width:21%;aspect-ratio:1;touch-action:none;cursor:grab;transition:left .35s,top .35s;z-index:4;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.cwp.dragging{transition:none;cursor:grabbing}
.cwp svg,.cwp img{width:100%;height:100%;pointer-events:none;display:block}
.cwp.spin svg{animation:spin .55s linear infinite}
.cwp.ready{animation:bump .6s infinite alternate;cursor:pointer}
.cwp .hole{position:absolute;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:#121921;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.ctool{position:absolute;z-index:5;transition:left .4s ease,top .3s ease;pointer-events:none}
.ctool svg{width:100%;height:100%;display:block}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--ember2);z-index:6;pointer-events:none;animation:spk .55s ease-out forwards}
.cncui{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:50px;justify-content:center}

.castsvg,.poursvg{width:min(420px,100%);height:auto;display:block;max-height:100%}

/* compare / report */
.cmp{position:relative;width:min(100%,290px);aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(10,15,20,.6);border:1px solid var(--line)}
.cmp .cl{position:absolute;inset:0;padding:10%}
.cmp .cl svg,.cmp .cl img{width:100%;height:100%;display:block}
.cmp .cdiv{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--hue);box-shadow:0 0 8px var(--hue)}
.ctag{position:absolute;bottom:8px;font-family:var(--f-mono);font-size:11px;background:rgba(15,20,26,.8);padding:2px 8px;border-radius:99px;color:var(--muted)}
.ctag.l{left:8px}.ctag.r{right:8px}
.rep{width:min(560px,100%);background:rgba(240,244,248,.96);color:#1b232d;border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rep h4{margin:0;font-size:13px;line-height:1.3}
.rep .sample{font-family:var(--f-mono);font-size:10px;color:#b4540f;background:#ffe7d1;border-radius:4px;padding:1px 6px;justify-self:start}
.rep .tw{overflow-x:auto}
.rep table{border-collapse:collapse;width:100%;font-size:11.5px}
.rep th,.rep td{text-align:left;padding:3px 4px;border-bottom:1px solid #d3dbe4;font-variant-numeric:tabular-nums}
.rep th{font-size:10.5px;color:#5b6a7c;font-weight:500}
.rep td.ok{color:#128250;font-weight:700}
.rep .pass{justify-self:end;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:18px;color:#128250;border:2px solid #128250;border-radius:6px;padding:0 12px;transform:rotate(-4deg)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.phead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sopno{font-family:var(--f-mono);font-size:12px;background:var(--hue);color:#08121a;border-radius:5px;padding:1px 8px;font-weight:500}
.panel h2{margin:0;font-family:var(--f-display);font-size:24px;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
.sop{margin:0;color:var(--muted);font-size:13px}
.task{margin:0;font-size:16px;font-weight:500}
.why{margin:0;font-size:13px;color:#b9c5d3}
.why b{font-family:var(--f-mono);font-size:11px;color:var(--hue);font-weight:500;letter-spacing:.06em;margin-right:6px}
.fb{min-height:44px;padding:9px 12px;border-radius:8px;border-left:3px solid var(--line);background:var(--panel2);color:var(--muted);font-size:14px}
.fb.ok{border-color:var(--ok);color:var(--fg)}
.fb.hint{border-color:var(--ember2);color:var(--fg)}
.panel .row{display:flex;justify-content:flex-end}

.card-big{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:enter .45s ease both}
.hero{position:relative;height:clamp(190px,36vw,300px)}
.hero .bg{position:absolute;inset:0;width:100%;height:100%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,var(--panel),transparent 70%)}
.hero .heroprod{position:absolute;right:6%;bottom:8%;width:clamp(90px,22vw,170px);filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.hero .heroprod svg{width:100%;height:auto;display:block}
.body{padding:6px 18px 20px;display:grid;gap:12px;justify-items:start}
.body h1{margin:0;font-family:var(--f-display);font-size:clamp(34px,8vw,56px);letter-spacing:.07em;line-height:1;text-wrap:balance}
.body h1 em{font-style:normal;color:var(--ember)}
.body p{margin:0;max-width:62ch;color:#c4cfdb}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.stagelist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;width:100%}
.stagelist li{display:flex;gap:8px;align-items:center;font-size:13px;color:#c4cfdb}
.stagelist i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.stagelist.sm{grid-template-columns:1fr}
.stagelist .sub{display:block;color:var(--muted);font-size:12px}
.stageno{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--hue)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 0}
.sumcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;width:100%}
.sumcols h3{margin:0 0 4px;font-family:var(--f-display);font-size:17px;letter-spacing:.05em;color:var(--c)}
.sumcols ol{margin:0;padding:0;list-style:none;font-size:13px;color:#c4cfdb;display:grid;gap:2px}
.sumcols li::before{content:"✓ ";color:var(--ok)}
.sumcols .n{font-family:var(--f-mono);color:var(--muted);font-size:11px;margin-right:4px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.order{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:14px;width:100%;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.order .dwg{width:100%}
.order .dwg svg{width:100%;height:auto;display:block}
.order dl{margin:0;display:grid;gap:6px;font-size:13px}
.order dt{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.order dd{margin:0;color:var(--fg)}
.journey{display:flex;align-items:center;gap:2px;width:100%;padding-bottom:4px}
.jn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1}
.jn svg,.jn img{width:clamp(30px,8vw,60px);height:auto}
.jn small{font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
.journey .ar{color:var(--ember);flex:none}
.stamp{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;color:var(--ok);border:2px solid var(--ok);border-radius:6px;padding:0 12px;font-size:20px}

.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
@media (max-width:560px){.zones{grid-template-columns:repeat(2,1fr)}}
.zn{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0;opacity:.5}
.zn span{font-family:var(--f-mono);font-size:11px}
.zn.on{opacity:1;color:var(--fg);border-color:var(--c)}
.zn.on span{color:var(--c)}
.zn.new{animation:unlock .9s ease both;box-shadow:0 0 0 2px var(--c)}
.zn:not(.on)::after{content:"LOCKED";font-family:var(--f-mono);font-size:10px;letter-spacing:.1em}
.achbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--ember2);border-radius:12px;padding:8px 14px;animation:enter .5s ease both}
.achbar svg,.ach svg,.finalbadge svg{width:38px;height:38px;flex:none}
.achbar small,.finalbadge small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ember2)}
.achbar b,.finalbadge b{font-size:15px;font-weight:700}
.setl{width:100%;display:grid;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.setl h3{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.05em}
.setl h4{margin:8px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--hue);font-weight:500}
.sethead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.sethead .sample{font-family:var(--f-mono);font-size:10px;color:var(--ember2);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.grade{display:flex;align-items:baseline;gap:12px}
.grade b{font-family:var(--f-display);font-size:60px;line-height:1;color:var(--ember)}
.grade span{font-family:var(--f-mono);color:var(--muted)}
.met{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:5px 0;font-size:13px}
.met span{color:var(--muted)}
.met b{font-weight:500;text-align:right}
.achgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;opacity:.38}
.ach.on{opacity:1}
.ach small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.finalbadge{display:flex;align-items:center;gap:10px;margin-top:6px;border:1px solid var(--ember2);border-radius:12px;padding:8px 12px;justify-self:start}
.defect{position:absolute;width:16%;height:3px;margin:-1px 0 0 -8%;background:#3a4757;border-radius:2px;transform:rotate(-28deg);box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.ring{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid var(--bad);border-radius:50%}
@keyframes unlock{0%{transform:scale(.9);opacity:.3}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.55}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,201,220,.6)}100%{box-shadow:0 0 0 14px rgba(56,201,220,0)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes wig{from{transform:translate(-1.5px,0) rotate(-.8deg)}to{transform:translate(1.5px,1px) rotate(.8deg)}}
@keyframes bump{50%{transform:scale(.94)}}
@keyframes glow{50%{opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spk{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes popin{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@keyframes ndrop{to{transform:rotate(-125deg)}}
.glow{animation:glow 1.8s ease-in-out infinite}
.nd{transform-origin:60px 60px;transform-box:view-box}
.nd.drop{animation:ndrop 3.2s ease-in forwards}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
/* ============================================================
   素材替換 / Asset overrides  (遊戲邏輯與圖片分離)
   把實際照片的網址填進來即可,不必改遊戲邏輯。圖片載入失敗時會自動改用內建插畫。
   Put real photo URLs here; no game logic changes needed.
   If an image fails to load, the built-in illustration is used instead.

   ASSETS.stages[0..5]  關卡背景照片 / stage background photos
   ASSETS.icons.<name>  取代同名插畫 / replaces the drawn icon of that name

   同一件產品 (product, one part through all six stages):
     pIngot 原料 · pRaw 粗鑄件 · pCut 切料頭後 · pRough 清砂心後 · pClean 去毛邊後
     pSmooth 整理後鑄件 · pTurned 車削後 · pMach CNC 加工件 · pDone 檢驗完成 · pBox 成品包裝
   設備 (equipment):
     furnace ladle mold moldSec core oven saw hardness spectro code lathe mill cmm fixture
     gaugeOk gaugeLeak box label shelf truck bracket clip drawing model3d
   ============================================================ */
const ASSETS = { stages:{}, icons:{} };

const AL='url(#gAlu)', ST='url(#gSteel)', MO='url(#gMol)';

/* ---------- 同一件產品:依狀態繪製 ---------- */
const NZ=[0,2,-1.5,2.5,-1,1.5,-2,2,-1,1,-2.5,2,-1,1.5,-1.5,2,-1,2];
function roughPath(cx,cy,r){let d='';NZ.forEach((nz,i)=>{const a=i/NZ.length*Math.PI*2;d+=(i?'L':'M')+(cx+(r+nz)*Math.cos(a)).toFixed(1)+' '+(cy+(r+nz)*Math.sin(a)).toFixed(1)});return d+'Z'}
function PROD(o){
  let s='<ellipse cx="60" cy="112" rx="40" ry="5" fill="#000" opacity=".25"/>';
  if(o.risers) s+='<rect x="28" y="8" width="18" height="36" rx="3" fill="url(#gRaw)"/><rect x="74" y="8" width="18" height="36" rx="3" fill="url(#gRaw)"/><rect x="40" y="26" width="40" height="12" fill="url(#gRaw)"/><path d="M28 9h18M74 9h18" stroke="#ffb15c" stroke-width="3" opacity=".7"/>';
  if(o.rough){
    s+=`<g transform="translate(0 7)"><path d="${roughPath(60,72,36)}" fill="#4c5766"/></g><path d="${roughPath(60,72,36)}" fill="url(#gRaw)"/>`;
    s+=[[44,58],[78,62],[52,88],[72,84],[60,52],[86,76]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="1.4" fill="#2f3945" opacity=".45"/>`).join('');
  } else {
    s+='<circle cx="60" cy="79" r="36" fill="#6f7d8d"/><circle cx="60" cy="72" r="36" fill="url(#gAlu)"/>';
  }
  if(o.turned) s+='<circle cx="60" cy="72" r="30" fill="none" stroke="#fff" stroke-width="1.4" opacity=".5"/><circle cx="60" cy="72" r="24" fill="none" stroke="#fff" stroke-width="1.2" opacity=".3"/><path d="M34 54A30 30 0 0 1 66 42" stroke="#fff" stroke-width="3" opacity=".75" fill="none" stroke-linecap="round"/>';
  if(o.core) s+='<circle cx="60" cy="72" r="13" fill="#c9a874"/><path d="M52 66l16 12M52 78l16-12" stroke="#a98a58" stroke-width="2"/>';
  else if(o.turned) s+='<circle cx="60" cy="72" r="17" fill="#eef3f8"/><circle cx="60" cy="72" r="12.5" fill="#121921"/>';
  else s+='<circle cx="60" cy="72" r="12.5" fill="#121921" stroke="#4c5766" stroke-width="2"/>';
  if(o.holes) s+=[[79,53],[41,53],[41,91],[79,91]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#121921" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/>`).join('');
  if(o.burr) s+='<g fill="#c3ccd6" stroke="#6b7888" stroke-width="1"><path d="M22 66L11 72L22 79Z"/><path d="M98 66L109 72L98 79Z"/><path d="M30 94L22 105L38 102Z"/><path d="M90 94L98 105L82 102Z"/></g>';
  if(o.badge) s+='<circle cx="96" cy="102" r="15" fill="#4fd08a" stroke="#0f141a" stroke-width="2"/><path d="M88 102l6 6 11-12" stroke="#06210f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  return s;
}

const holes=[[60,36],[84,60],[60,84],[36,60]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#1b232d"/>`).join('');
const pol=(a,r)=>[(60+r*Math.cos(a*Math.PI/180)).toFixed(1),(60-r*Math.sin(a*Math.PI/180)).toFixed(1)];
const garc=(a1,a2,c)=>{const p=pol(a1,40),q=pol(a2,40);return `<path d="M${p[0]} ${p[1]}A40 40 0 0 1 ${q[0]} ${q[1]}" stroke="${c}" stroke-width="7" fill="none"/>`};
const gauge=leak=>`<circle cx="60" cy="60" r="48" fill="#e8edf2" stroke="#3a4757" stroke-width="7"/>${garc(200,150,'#ff5d5d')}${garc(80,20,'#4fd08a')}<g class="nd ${leak?'drop':''}"><path d="M60 60L${pol(50,34).join(' ')}" stroke="#1b232d" stroke-width="4" stroke-linecap="round"/></g><circle cx="60" cy="60" r="6" fill="#1b232d"/>`;

const ICON = {
  ingot:`<path d="M12 90l10-24h76l10 24z" fill="${AL}"/><path d="M26 66l8-16h52l8 16z" fill="#eef3f8"/><path d="M12 90h96v8H12z" fill="#7f8da0"/><path d="M34 50l6-14h40l6 14z" fill="${AL}"/>`,
  furnace:`<rect x="24" y="12" width="14" height="34" fill="#3a4757"/><rect x="12" y="42" width="96" height="62" rx="8" fill="${ST}"/><rect x="8" y="36" width="104" height="12" rx="4" fill="#3a4757"/><path d="M32 104V78a28 28 0 0 1 56 0v26z" fill="${MO}" class="glow"/><rect x="12" y="104" width="96" height="8" rx="3" fill="#252f3b"/>`,
  ladle:`<path d="M12 26L70 62" stroke="#8d9bab" stroke-width="7" stroke-linecap="round"/><path d="M64 62h46a23 23 0 0 1-46 0z" fill="#3a4757"/><ellipse cx="87" cy="62" rx="23" ry="6" fill="${MO}" class="glow"/>`,
  mold:`<rect x="12" y="26" width="96" height="32" rx="4" fill="${ST}"/><rect x="12" y="64" width="96" height="32" rx="4" fill="#2c3846"/><path d="M40 64h40v-6a20 14 0 0 0-40 0z" fill="#0f141a"/><rect x="54" y="14" width="12" height="14" fill="#8d9bab"/>`,
  moldSec:`<rect x="8" y="12" width="104" height="44" rx="3" fill="${ST}"/><rect x="8" y="64" width="104" height="44" rx="3" fill="#2c3846"/><rect x="34" y="46" width="52" height="28" rx="4" fill="#0f141a"/><path d="M46 12h28l-6 8H52z" fill="#0f141a"/><rect x="52" y="12" width="16" height="34" fill="#0f141a"/><rect x="76" y="26" width="14" height="22" fill="#0f141a"/><path d="M4 60h112" stroke="#ff7a1a" stroke-width="3" stroke-dasharray="7 5"/>`,
  core:`<rect x="34" y="26" width="52" height="68" rx="10" fill="#c9a874"/><rect x="24" y="44" width="12" height="32" fill="#a98a58"/><rect x="84" y="44" width="12" height="32" fill="#a98a58"/><path d="M46 38v44M60 36v48M74 38v44" stroke="#a98a58" stroke-width="2.5"/>`,
  saw:`<rect x="16" y="90" width="88" height="14" rx="3" fill="#3a4757"/><path d="M28 90V34a32 32 0 0 1 64 0" fill="none" stroke="#8d9bab" stroke-width="8"/><rect x="22" y="56" width="76" height="4" fill="#ffb15c"/><rect x="40" y="62" width="40" height="22" rx="3" fill="${AL}"/>`,
  oven:`<rect x="12" y="20" width="96" height="82" rx="6" fill="${ST}"/><rect x="26" y="36" width="68" height="50" rx="3" fill="#1b232d"/><path d="M40 78q6-10 0-20M60 78q6-10 0-20M80 78q6-10 0-20" stroke="#ff7a1a" stroke-width="4" fill="none" stroke-linecap="round" class="glow"/><circle cx="24" cy="28" r="3.5" fill="#ff7a1a"/>`,
  hardness:`<path d="M30 104V26h50v16H46v62z" fill="${ST}"/><rect x="22" y="100" width="64" height="10" rx="2" fill="#3a4757"/><circle cx="88" cy="34" r="20" fill="#e8edf2"/><path d="M88 34l10-10" stroke="#ff5d5d" stroke-width="3"/><rect x="60" y="76" width="44" height="14" fill="${AL}"/><rect x="78" y="58" width="8" height="18" fill="#7f8da0"/>`,
  code:`<rect x="10" y="16" width="100" height="66" rx="5" fill="#1b232d" stroke="#3a4757" stroke-width="4"/><path d="M22 32h32M22 43h54M22 54h38M22 65h48" stroke="#4fd08a" stroke-width="3.5" stroke-linecap="round"/><rect x="50" y="86" width="20" height="10" fill="#3a4757"/><rect x="34" y="96" width="52" height="7" rx="2" fill="#3a4757"/>`,
  lathe:`<rect x="8" y="84" width="104" height="16" rx="3" fill="#3a4757"/><rect x="12" y="38" width="28" height="48" rx="3" fill="${ST}"/><rect x="40" y="52" width="42" height="26" fill="${AL}"/><rect x="88" y="42" width="16" height="42" fill="#2c3846"/><path d="M92 54l-14 20h20z" fill="#ffb15c"/>`,
  mill:`<rect x="8" y="96" width="104" height="10" rx="3" fill="#3a4757"/><rect x="80" y="12" width="24" height="86" fill="${ST}"/><rect x="38" y="12" width="52" height="16" fill="#3a4757"/><rect x="55" y="28" width="10" height="28" fill="#8d9bab"/><path d="M50 56h20l-5 14h-10z" fill="#ffb15c"/><rect x="22" y="82" width="64" height="14" rx="2" fill="#2c3846"/><rect x="36" y="74" width="40" height="10" fill="${AL}"/>`,
  cmm:`<rect x="8" y="94" width="104" height="12" fill="#5b6a7c"/><rect x="14" y="26" width="12" height="68" fill="#3a4757"/><rect x="94" y="26" width="12" height="68" fill="#3a4757"/><rect x="14" y="20" width="92" height="14" fill="${ST}"/><rect x="56" y="34" width="8" height="38" fill="#8d9bab"/><circle cx="60" cy="76" r="4.5" fill="#ff5d5d"/><rect x="34" y="82" width="52" height="12" rx="2" fill="${AL}"/>`,
  fixture:`<rect x="12" y="92" width="96" height="14" rx="3" fill="#3a4757"/><rect x="26" y="52" width="68" height="42" rx="4" fill="${ST}"/><rect x="38" y="24" width="44" height="30" rx="3" fill="#2c3846"/><rect x="54" y="12" width="12" height="16" fill="#8d9bab"/><circle cx="60" cy="73" r="14" fill="#121921" stroke="#8d9bab" stroke-width="3"/><path d="M94 72h14V46" stroke="#38c9dc" stroke-width="4" fill="none"/>`,
  gaugeOk:gauge(false), gaugeLeak:gauge(true),
  spectro:`<rect x="12" y="28" width="96" height="68" rx="6" fill="${ST}"/><rect x="22" y="38" width="52" height="32" rx="3" fill="#0f141a"/><path d="M26 62l9-14 9 9 9-16 9 12 8-6" stroke="#38c9dc" stroke-width="3" fill="none"/><circle cx="92" cy="54" r="9" fill="#2c3846" stroke="#8d9bab" stroke-width="3"/><rect x="22" y="78" width="76" height="9" fill="#2c3846"/>`,

  box:`<path d="M14 44l46-22 46 22v46l-46 22-46-22z" fill="#c8a06a"/><path d="M60 112V66L14 44M60 66l46-22" stroke="#8f6f3f" stroke-width="3" fill="none"/><path d="M38 33l46 22v12L38 45z" fill="#e3c590"/>`,

  bracket:`<rect x="18" y="56" width="84" height="32" rx="4" fill="${AL}"/><rect x="38" y="26" width="44" height="34" rx="4" fill="#9fb0c2"/><circle cx="32" cy="72" r="6" fill="#3a4757"/><circle cx="88" cy="72" r="6" fill="#3a4757"/><circle cx="60" cy="43" r="7" fill="#3a4757"/>`,

  gate:`<path d="M18 22h84L74 62v40H46V62z" fill="${ST}"/>`
};
ICON.pIngot=ICON.ingot; ICON.pBox=ICON.box;
ICON.pRaw=PROD({rough:1,risers:1,core:1});
ICON.pCut=PROD({rough:1,core:1,burr:1});
ICON.pRough=PROD({rough:1,burr:1});
ICON.pClean=PROD({rough:1});
ICON.pSmooth=PROD({});
ICON.pTurned=PROD({turned:1});
ICON.pMach=PROD({turned:1,holes:1});
ICON.pDone=PROD({turned:1,holes:1,badge:1});

const svgOf=n=>`<svg viewBox="0 0 120 120" aria-hidden="true">${ICON[n]||''}</svg>`;
function ic(n){return ASSETS.icons[n]?`<img src="${ASSETS.icons[n]}" alt="" onerror="hqFb(this,'${n}')">`:svgOf(n)}
window.hqFb=(el,n)=>{const d=document.createElement('div');d.innerHTML=svgOf(n);el.replaceWith(d.firstChild)};

/* ---------- 工廠背景 (等角地板示意插畫) ---------- */
function BG(i){
  const lamps=[130,400,670].map(x=>`<path d="M${x-26} 0h52l56 290H${x-82}z" fill="url(#gLamp)"/><rect x="${x-36}" y="12" width="72" height="9" rx="4" fill="#dfe6ee"/>`).join('');
  const win=[60,200,340,480,620].map(x=>`<rect x="${x}" y="40" width="96" height="46" rx="3" fill="#24384d" opacity=".7"/>`).join('');
  const base=`<rect width="800" height="500" fill="url(#gWall)"/>${win}<rect y="318" width="800" height="182" fill="#10161d"/><rect y="318" width="800" height="182" fill="url(#iso)"/><path d="M0 318h800" stroke="#2c394a" stroke-width="3"/>${lamps}`;
  const X={

/* ---------- 工具 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
/* 每次遊玩隨機決定的情境 (window.__rand 只給測試用) */
function fresh(){return {screen:'start',si:0,pi:0,prod:0,miss:0,stageMiss:[0,0,0,0,0,0],anom:{},pourMiss:null,ach:[],newAch:[],
  rand:Object.assign({oot:Math.random()<.5,leak:rnd(3),defectOn:Math.random()<.6,defect:rnd(3),ship:rnd(2)},window.__rand||{})}}
let S=fresh();
/* 目前實際要玩的互動:略過未觸發的隨機情境,並展開 gen 產生的內容 */
const PHS=i=>STEPS[i].ph.filter(p=>!p.cond||S.rand[p.cond]).map(p=>p.gen?p.gen():p);
let cleanups=[];
const app=$('#app');
function setHue(c){document.documentElement.style.setProperty('--hue',c)}
function setLang(v){
  lang=v; const r=document.documentElement; r.dataset.lang=v; r.lang=v==='zh'?'zh-Hant':'en';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
}
function headHTML(){
  return `<div class="top"><div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l15 8.5v17L20 37 5 28.5v-17z" fill="#18202a" stroke="#ff7a1a" stroke-width="2.5"/><path d="M13 14v12M27 14v12M13 20h14" stroke="#cfd8e1" stroke-width="3" stroke-linecap="round"/></svg><div><b>HONHO FACTORY QUEST</b><small>HONHO PRECISION INDUSTRY CORPORATION · 宏合精研</small></div></div>
  <div class="lang" role="group" aria-label="Language">${LANGS.map(l=>`<button data-act="lang" data-v="${l}" aria-pressed="${lang===l}">${LANG_META[l]}</button>`).join('')}</div></div>`;
}
function bgFor(i){return ASSETS.stages[i]?`${BG(i)}<img class="bgimg" src="${ASSETS.stages[i]}" alt="" onerror="this.remove()">`:BG(i)}
function trackInner(){return PSTATES.map((p,i)=>`<div class="tn ${i<S.prod?'done':i===S.prod?'cur':''}">${ic(p.icon)}<small>${LH(p.l)}</small></div>`).join('')}

/* ---------- 畫面 ---------- */
function viewStart(){
  setHue('#ff7a1a');
  return `${headHTML()}<div class="card-big"><div class="hero" style="--hue:#ff7a1a">${bgFor(1)}<div class="shade"></div><div class="heroprod">${ic('pRaw')}</div></div>
  <div class="body"><h1>HONHO <em>FACTORY</em> QUEST</h1>
  <p>${LH(z('跟著同一件鋁合金產品,走過 6 個關卡、19 道工序:從客戶圖面開始,鑄造、整理、CNC 精密加工、檢驗,最後出貨。','Follow one aluminum part through 6 stages and 19 processes: from the customer’s drawing to casting, finishing, CNC precision machining, inspection and shipping.'))}</p>
  <div class="tags"><span>${T('tag')}</span></div>
  <ul class="stagelist">${STAGES.map((s,i)=>`<li style="--c:${s.c}"><i></i>${i+1}. ${LH(s.t)}</li>`).join('')}</ul>
  <button class="btn" data-act="start">${T('start')}</button></div></div><p class="note">${T('note')}</p>`;
}

let fin=false;
function setProd(n){

function startPhase(){
  fin=false;
  const st=STEPS[S.si], phs=PHS(S.si), ph=phs[S.pi], scene=$('#scene'), fbEl=$('#fb'), nextBtn=$('#next');
  const lastPh=S.pi===phs.length-1, lastStep=S.si===STEPS.length-1;
  let phMiss=0;
  const api={
    done(msg){ if(fin) return; fin=true;
      if(ph.anom) S.anom[ph.anom]=phMiss; if(ph.tag==='pour') S.pourMiss=phMiss;
      if(ph.prod!=null) setProd(ph.prod);
      fbEl.className='fb ok'; fbEl.innerHTML='✓ '+LH(msg)+(lastPh?`  ·  SOP ${String(S.si+1).padStart(2,'0')} ${T('complete')}`:'');
      scene.classList.remove('flash'); void scene.offsetWidth; scene.classList.add('flash');
      nextBtn.innerHTML=lastPh?(lastStep?T('finish'):T('nextStep')):T('nextPhase'); nextBtn.hidden=false; },
    hint(msg,soft){ if(fin) return; if(!soft){phMiss++;S.miss++;S.stageMiss[st.st]++;} fbEl.className='fb hint'; fbEl.innerHTML=LH(msg)+' '+T('retry');
      scene.classList.remove('shake'); void scene.offsetWidth; scene.classList.add('shake'); },
    say(msg){ if(fin) return; fbEl.className='fb ok'; fbEl.innerHTML=LH(msg); },
    cleanup(f){cleanups.push(f)},
    later(fn,ms){const t=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(t));return t}
  };
  PH[ph.k](ph,$('#play'),api);
}
function advance(){
  if(!fin) return;
  const phs=PHS(S.si), st=STEPS[S.si];
  if(S.pi<phs.length-1){S.pi++;render();return;}
  const endStage=(S.si===STEPS.length-1)||STEPS[S.si+1].st!==st.st;
  if(endStage) stageDone(st.st);
  if(S.si===STEPS.length-1){S.screen='end';render();window.scrollTo(0,0);return;}
  S.si++;S.pi=0;S.screen=endStage?'intro':'play';render();window.scrollTo(0,0);
}
app.addEventListener('click',e=>{

});

/* ---------- 拖曳(滑鼠、觸控、鍵盤都可用) ---------- */
function enableDrag(el,tgt,onDrop,onMiss){
  el._x=0;el._y=0; let id=null,sx=0,sy=0,ox=0,oy=0,moved=false;
  const hit=()=>{const a=el.getBoundingClientRect(),b=tgt.getBoundingClientRect(),cx=a.left+a.width/2,cy=a.top+a.height/2;return cx>b.left-16&&cx<b.right+16&&cy>b.top-16&&cy<b.bottom+16};
  const reset=()=>{el._x=0;el._y=0;el.style.transform=''};
  el.addEventListener('pointerdown',e=>{if(el.dataset.lock)return;e.preventDefault();id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}sx=e.clientX;sy=e.clientY;ox=el._x;oy=el._y;moved=false;el.classList.add('dragging')});
  el.addEventListener('pointermove',e=>{if(id!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;el._x=ox+dx;el._y=oy+dy;el.style.transform=`translate(${el._x}px,${el._y}px)`;tgt.classList.toggle('over',hit())});
  el.addEventListener('pointerup',e=>{if(id!==e.pointerId)return;id=null;tgt.classList.remove('over');el.classList.remove('dragging');if(!moved||hit())onDrop(el);else{reset();onMiss()}});
  el.addEventListener('pointercancel',e=>{if(id!==e.pointerId)return;id=null;tgt.classList.remove('over');el.classList.remove('dragging');reset()});
  el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!el.dataset.lock){e.preventDefault();onDrop(el)}});
}

/* ---------- 互動類型 ---------- */
const PH={
  spot(ph,root,api){
    const got=new Set();
    root.innerHTML=`<div class="obj big" id="obj"><div class="ico">${ic(ph.icon)}</div>${ph.pts.map((p,i)=>`<button class="hot" data-i="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="${L(p.l)}"></button>`).join('')}</div><div class="chips" id="chips"></div><div class="cap">${T('tapcallout')}</div>`;
    const chips=$('#chips',root);
    $('#obj',root).addEventListener('click',e=>{
      const h=e.target.closest('.hot');
      if(!h){api.hint(UI.miss,true);return;}
      const i=+h.dataset.i; if(got.has(i)) return;
      got.add(i); h.classList.add('on');
      chips.insertAdjacentHTML('beforeend',`<span class="chip">✓ ${LH(ph.pts[i].l)}</span>`);
      if(ph.pts[i].info) api.say(ph.pts[i].info);
      if(got.size===ph.pts.length){
        if(ph.after){$('.ico',root).innerHTML=ic(ph.after);root.querySelectorAll('.hot').forEach(x=>x.style.display='none');}
        api.done(ph.done);
      }
    });
  },
  tap(ph,root,api){
    let n=0;
    root.innerHTML=`<button class="tapobj" id="t" aria-label="${L(ph.q)}">${ic(ph.icon)}</button><div class="bar"><i id="bf"></i></div><div class="cap">${LH(UI.tapx(ph.n))}</div>`;
    const t=$('#t',root), bf=$('#bf',root);
    t.addEventListener('click',()=>{
      if(n>=ph.n) return; n++; bf.style.width=(n/ph.n*100)+'%';
      t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump');
      if(n>=ph.n){t.disabled=true;if(ph.after)t.innerHTML=ic(ph.after);api.done(ph.done);}
    });
  },
  pick(ph,root,api){
    root.innerHTML=`${ph.hdr?`<div class="hdr">${ic(ph.hdr)}</div>`:''}<div class="opts">${ph.opts.map((o,i)=>`<button class="card" data-i="${i}">${ic(o.icon)}<b>${LH(o.l)}</b>${o.s?`<small>${LH(o.s)}</small>`:''}</button>`).join('')}</div>`;
    root.addEventListener('click',e=>{
      const c=e.target.closest('.card'); if(!c||c.disabled) return;
      const o=ph.opts[+c.dataset.i];
      if(o.ok){c.classList.add('ok');root.querySelectorAll('.card').forEach(x=>x.disabled=true);api.done(ph.done);}
      else{c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');c.disabled=true;api.hint(o.hint);}
    });
  },
  order(ph,root,api){
    let next=0; const n=ph.items.length;
    const idx=ph.items.map((_,i)=>i).reverse();
    root.innerHTML=`<div class="steps">${idx.map(i=>`<button class="stepchip" data-i="${i}">${ic(ph.items[i].icon)}<span class="no"></span><span>${LH(ph.items[i].l)}</span></button>`).join('')}</div><div class="cap">1 → ${n}</div>`;
    root.addEventListener('click',e=>{
      const c=e.target.closest('.stepchip'); if(!c||c.classList.contains('ok')) return;
      if(+c.dataset.i===next){
        next++; c.classList.add('ok'); c.querySelector('.no').textContent=next;
        if(next===n) api.done(ph.done);
      } else {
        c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');
        api.hint(ph.hint||UI.wrongOrder);
      }
    });
  },
  hold(ph,root,api){
    const fx=ph.fx;
    const layers=fx==='wipe'?`<div class="l0">${ic(ph.from)}</div><div class="l1" style="clip-path:inset(0 100% 0 0)">${ic(ph.to)}</div>`
      :fx==='rise'?`<div class="l1" style="clip-path:inset(100% 0 0 0)">${ic(ph.icon)}</div>`
      :`<div class="l0">${ic(ph.icon)}</div>`;
    root.innerHTML=`<div class="obj" id="ho">${layers}</div><div class="bar"><i id="bf"></i></div><button class="holdbtn" id="hb">${T('hold')}</button>`;
    const ho=$('#ho',root), bf=$('#bf',root), hb=$('#hb',root), l0=$('.l0',root), l1=$('.l1',root);
    const paint=p=>{
      bf.style.width=(p*100)+'%';
      if(fx==='wipe') l1.style.clipPath=`inset(0 ${100-p*100}% 0 0)`;
      else if(fx==='rise') l1.style.clipPath=`inset(${100-p*100}% 0 0 0)`;
      else if(fx==='glow') l0.style.filter=`brightness(${1+p*.5}) drop-shadow(0 0 ${p*22}px #ff7a1a)`;
    };
    let p=0,down=false,last=0,raf=0,ended=false;
    const tick=t=>{
      if(!last) last=t; const dt=Math.min(.1,(t-last)/1000); last=t;
      if(down&&!ended){p=Math.min(1,p+dt/ph.secs); paint(p);
        if(p>=1){ended=true;ho.classList.remove('run');hb.disabled=true;api.done(ph.done);return;}}
      raf=requestAnimationFrame(tick);
    };
    const on=e=>{e.preventDefault();down=true;ho.classList.add('run')};
    const off=()=>{down=false;ho.classList.remove('run')};
    hb.addEventListener('pointerdown',on);
    ['pointerup','pointercancel','pointerleave'].forEach(v=>hb.addEventListener(v,off));
    hb.addEventListener('contextmenu',e=>e.preventDefault());
    hb.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){on(e)}});
    hb.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){off()}});
    raf=requestAnimationFrame(tick); api.cleanup(()=>cancelAnimationFrame(raf));
  },
  pour(ph,root,api){
    const b0=172-64*ph.band[0]/100, b1=172-64*ph.band[1]/100;
    root.innerHTML=`<svg class="poursvg" viewBox="0 0 300 200" aria-hidden="true">
      <rect x="130" y="70" width="140" height="118" rx="6" fill="${ST}"/><rect x="188" y="70" width="24" height="38" fill="#0f141a"/><rect x="158" y="108" width="84" height="64" rx="4" fill="#0f141a"/>
      <rect id="pf" x="158" y="172" width="84" height="0" fill="${MO}"/><rect id="ps" x="194" y="70" width="12" height="0" fill="${MO}"/>
      <path d="M150 ${b0}h100M150 ${b1}h100" stroke="#4fd08a" stroke-width="2" stroke-dasharray="5 4"/>
      <rect id="st" x="198" y="56" width="4" height="0" fill="#ffb15c"/>
      <g id="lad" style="transform-origin:170px 45px;transform-box:view-box"><rect x="70" y="38" width="76" height="6" fill="#8d9bab"/><path d="M140 40h60a30 30 0 0 1-60 0z" fill="#3a4757"/><ellipse cx="170" cy="40" rx="30" ry="4" fill="${MO}"/></g></svg>
      <button class="holdbtn" id="hb">${T('pour')}</button>`;
    const pf=$('#pf',root), ps=$('#ps',root), st=$('#st',root), lad=$('#lad',root), hb=$('#hb',root);
    let v=0,down=false,last=0,raf=0,ended=false;
    const paint=()=>{pf.setAttribute('y',172-64*v/100);pf.setAttribute('height',64*v/100);
      ps.setAttribute('height',down&&v>0?38:0);st.setAttribute('height',down?(v>0?52:0):0);
      lad.style.transform=`rotate(${down?Math.min(32,v*1.2+8):0}deg)`;};
    const release=()=>{
      if(!down||ended) return; down=false; paint();
      if(v>=ph.band[0]&&v<=ph.band[1]){ended=true;hb.disabled=true;api.done(ph.done);}
      else{api.hint(v<ph.band[0]?ph.low:ph.high);v=0;paint();}
    };
    const tick=t=>{
      if(!last) last=t; const dt=Math.min(.1,(t-last)/1000); last=t;
      if(down&&!ended){v=Math.min(100,v+dt*36);paint();if(v>=100) release();}
      raf=requestAnimationFrame(tick);
    };
    hb.addEventListener('pointerdown',e=>{e.preventDefault();if(ended)return;down=true;paint();});
    ['pointerup','pointercancel','pointerleave'].forEach(x=>hb.addEventListener(x,release));
    hb.addEventListener('contextmenu',e=>e.preventDefault());
    hb.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!down&&!ended){down=true;paint();}});
    hb.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')release();});
    raf=requestAnimationFrame(tick); api.cleanup(()=>cancelAnimationFrame(raf));
  },
  cast(ph,root,api){
    root.innerHTML=`<svg class="castsvg" viewBox="0 0 300 190" aria-hidden="true">
      <g><rect x="70" y="110" width="160" height="56" rx="4" fill="${ST}"/></g>
      <g id="top" style="transition:transform .8s ease"><rect x="70" y="56" width="160" height="54" rx="4" fill="${ST}"/><rect x="146" y="38" width="8" height="72" fill="#0f141a"/></g>
      <g id="cav" style="transition:opacity .3s"><rect x="104" y="92" width="92" height="36" rx="3" fill="#0f141a"/>
        <rect id="al" x="104" y="92" width="92" height="36" rx="3" fill="#a3b1c1" opacity="0" style="transition:opacity 1.4s"/>
        <rect id="mol" x="104" y="92" width="92" height="36" rx="3" fill="${MO}" style="transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .9s ease-out,opacity 1.4s"/></g>
      <svg id="cst" x="100" y="8" width="100" height="108" viewBox="0 0 120 120" style="opacity:0;transition:opacity .4s,transform .7s">${ICON.pRaw}</svg></svg>
      <div class="cap" id="cc">&nbsp;</div>`;
    const g=id=>$('#'+id,root), cc=g('cc');
    const say=(zh,en)=>{cc.innerHTML=LH(z(zh,en))};
    api.later(()=>{g('mol').style.transform='scaleY(1)';say('① 鋁液流入模穴,填滿','① Molten aluminum fills the cavity')},80);
    api.later(()=>{g('mol').style.opacity='0';g('al').style.opacity='1';say('② 模具冷卻,鋁液凝固','② The mold cools and the metal solidifies')},1200);
    api.later(()=>{g('cav').style.opacity='0';g('top').style.transform='translateY(-56px)';g('cst').style.opacity='1';say('③ 開模','③ The mold opens')},2800);
    api.later(()=>{g('cst').style.transform='translateY(-14px)';say('④ 取出粗鑄件','④ The raw casting is removed')},3800);
    api.later(()=>api.done(ph.done),4700);
  },
  slider(ph,root,api){
    const p2=(v,r)=>{const a=(180-v*1.8)*Math.PI/180;return [(100+r*Math.cos(a)).toFixed(1),(100-r*Math.sin(a)).toFixed(1)]};
    const arc=(a,b,c)=>{const p=p2(a,78),q=p2(b,78);return `<path d="M${p[0]} ${p[1]}A78 78 0 0 1 ${q[0]} ${q[1]}" stroke="${c}" stroke-width="12" fill="none"/>`};
    root.innerHTML=`<svg class="dial" viewBox="0 0 200 120" aria-hidden="true">${arc(0,ph.band[0],'#38c9dc')}${arc(ph.band[0],ph.band[1],'#4fd08a')}${arc(ph.band[1],100,'#ff5d5d')}<line id="nd" x1="100" y1="100" x2="100" y2="34" stroke="#e8edf2" stroke-width="4" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#e8edf2"/></svg>
    <input class="rg" id="rg" type="range" min="0" max="100" value="12" aria-label="${L(ph.q)}"><div class="cap tag">${LH(UI.sample)}</div><button class="btn" id="lk">${T('lock')}</button>`;
    const rg=$('#rg',root), nd=$('#nd',root);
    const upd=()=>{const p=p2(+rg.value,66);nd.setAttribute('x2',p[0]);nd.setAttribute('y2',p[1]);};
    rg.addEventListener('input',upd); upd();
    $('#lk',root).addEventListener('click',()=>{
      const v=+rg.value;
      if(v>=ph.band[0]&&v<=ph.band[1]){rg.disabled=true;$('#lk',root).disabled=true;api.done(ph.done);}
      else api.hint(v<ph.band[0]?ph.low:ph.high);
    });
  },
  drag(ph,root,api){
    const items=ph.items, n=items.length; let placed=0;
    root.innerHTML=`<div class="dz"><div class="dz-src">${items.map((it,i)=>`<div class="dgi" data-i="${i}" tabindex="0" role="button" aria-label="${L(ph.q)}">${ic(it.icon)}</div>`).join('')}</div><div class="dz-arrow" aria-hidden="true">➜</div><div class="dz-tgt" id="tg"><div class="tgi" id="tgi">${ic(ph.target.icon)}</div><div class="tgl">${LH(ph.target.l)}</div></div></div><div class="bar" id="bar" style="visibility:hidden"><i id="bf"></i></div><div class="cap" id="cp">${T('dragcap')}</div>`;
    const tg=$('#tg',root);
    const finish=()=>{
      if(!ph.fx){api.done(ph.done);return;}
      $('#tgi',root).classList.add(ph.fx.cls||'hot'); $('#cp',root).innerHTML=LH(ph.fx.cap);
      $('#bar',root).style.visibility='visible'; const bf=$('#bf',root);
      bf.style.transition=`width ${ph.fx.ms}ms linear`; requestAnimationFrame(()=>requestAnimationFrame(()=>bf.style.width='100%'));
      api.later(()=>api.done(ph.done),ph.fx.ms+80);
    };
    const drop=el=>{
      if(el.dataset.lock) return; el.dataset.lock='1';
      const a=el.getBoundingClientRect(), b=tg.getBoundingClientRect();
      const dx=(b.left+b.width/2)-(a.left+a.width/2), dy=(b.top+b.height/2)-(a.top+a.height/2);
      el.classList.remove('dragging'); el.style.transform=`translate(${el._x+dx}px,${el._y+dy}px) scale(.5)`; el.style.opacity='0';
      placed++; tg.classList.remove('over');
      if(placed===n) api.later(finish,260);
    };
    root.querySelectorAll('.dgi').forEach(el=>enableDrag(el,tg,drop,()=>api.hint(UI.dragmiss,true)));
  },
  cnc(ph,root,api){
    const lathe=ph.type==='lathe', tp=lathe?{x:30,y:50}:{x:45,y:62};
    const MACH=lathe
      ?`<svg class="m" viewBox="0 0 300 200" aria-hidden="true"><rect x="0" y="150" width="300" height="50" fill="#1b2430"/><rect x="10" y="50" width="62" height="92" rx="4" fill="${ST}"/><rect x="72" y="72" width="14" height="52" fill="#8d9bab"/><rect x="10" y="142" width="280" height="10" fill="#3a4757"/><rect x="226" y="70" width="62" height="72" rx="4" fill="${ST}"/><path d="M226 96h-12" stroke="#8d9bab" stroke-width="6"/><path d="M86 96h128" stroke="#3a4757" stroke-width="2" stroke-dasharray="6 4"/></svg>`
      :`<svg class="m" viewBox="0 0 300 200" aria-hidden="true"><rect x="0" y="154" width="300" height="46" fill="#1b2430"/><rect x="40" y="148" width="210" height="14" rx="3" fill="#3a4757"/><path d="M60 154h170" stroke="#5b6a7c" stroke-width="2" stroke-dasharray="14 8"/><rect x="236" y="14" width="46" height="136" fill="${ST}"/><rect x="104" y="18" width="150" height="30" rx="3" fill="#3a4757"/><rect x="128" y="48" width="44" height="20" fill="#2c3846"/></svg>`;
    const TOOL=lathe?'<svg viewBox="0 0 60 30"><rect x="20" y="4" width="40" height="22" fill="#5b6a7c"/><path d="M20 8L2 15L20 22z" fill="#ffb15c"/></svg>':'<svg viewBox="0 0 20 60"><rect x="6" y="0" width="8" height="34" fill="#8d9bab"/><path d="M5 34h10l-2 20h-6z" fill="#ffb15c"/></svg>';
    root.innerHTML=`<div class="cnc" id="cnc">${MACH}<div class="ctg" id="ctg" style="left:${tp.x}%;top:${tp.y}%"></div><div class="cwp" id="wp" tabindex="0" role="button" aria-label="${L(ph.q)}" style="left:5%;top:60%">${ic(ph.from)}</div><div class="ctool" id="tl" style="width:${lathe?'24%':'7%'};aspect-ratio:${lathe?'2/1':'1/3'};left:${lathe?'86%':'43%'};top:${lathe?'40%':'14%'}">${TOOL}</div></div><div class="cncui" id="ui"><div class="cap">${T('dragcap')}</div></div>`;
    const cnc=$('#cnc',root), wp=$('#wp',root), tl=$('#tl',root), ui=$('#ui',root), tg=$('#ctg',root);
    const W=()=>cnc.clientWidth, H=()=>cnc.clientHeight;
    const wpC=()=>({x:wp.offsetLeft+wp.offsetWidth/2,y:wp.offsetTop+wp.offsetHeight/2,w:wp.offsetWidth});
    const toolAt=(x,y)=>{tl.style.left=x+'px';tl.style.top=y+'px'};
    const spark=(x,y)=>{const s=document.createElement('span');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*60+10)+'px');s.style.setProperty('--dy',(Math.random()*50-25)+'px');cnc.appendChild(s);setTimeout(()=>s.remove(),600)};
    const park=()=>{ if(lathe) toolAt(W()*.86,wpC().y-tl.offsetHeight/2); else toolAt(wpC().x-tl.offsetWidth/2,H()*.08); };
    let state='drag';
    const mounted=()=>{
      state='ready';
      ui.innerHTML=`<button class="btn" id="go">${T('go')}</button>`;
      $('#go',root).addEventListener('click',run);
    };
    const onDrop=el=>{
      if(state!=='drag') return; state='mount'; wp.dataset.lock='1'; wp.classList.remove('dragging');
      wp.style.transition='none'; wp.style.left=(wp.offsetLeft+wp._x)+'px'; wp.style.top=(wp.offsetTop+wp._y)+'px'; wp.style.transform=''; wp._x=wp._y=0; void wp.offsetWidth; wp.style.transition='';
      wp.style.left=(tp.x*W()/100-wp.offsetWidth/2)+'px'; wp.style.top=(tp.y*H()/100-wp.offsetHeight/2)+'px';
      tg.style.display='none'; api.later(()=>{park();mounted()},420);
    };
    enableDrag(wp,tg,onDrop,()=>api.hint(UI.dragmiss,true));
    const progress=ms=>{ui.innerHTML=`<div class="bar"><i id="bf" style="transition:width ${ms}ms linear"></i></div><div class="cap">${LH(lathe?z('車削中…','Turning…'):z('銑削中…','Milling…'))}</div>`;const bf=$('#bf',root);requestAnimationFrame(()=>requestAnimationFrame(()=>bf.style.width='100%'))};
    const finishRun=()=>{
      state='out'; wp.classList.remove('spin'); wp.innerHTML=ic(ph.to); wp.querySelectorAll('.hole').forEach(h=>h.remove());
      park(); wp.classList.add('ready'); wp.dataset.lock=''; wp.style.cursor='pointer';
      ui.innerHTML=`<div class="cap tag">${T('takeout')}</div>`;
      const out=()=>{ if(state!=='out') return; state='done'; wp.classList.remove('ready'); wp.dataset.lock='1';
        wp.style.left=(W()*.74)+'px'; wp.style.top=(H()*.62)+'px'; api.later(()=>api.done(ph.done),420); };
      wp.addEventListener('click',out); wp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();out()}});
    };
    function run(){
      if(state!=='ready') return; state='run';
      const c=wpC();
      if(lathe){
        progress(2600); wp.classList.add('spin');
        const edge=c.x+c.w/2;
        toolAt(edge-6,c.y-tl.offsetHeight/2);
        const iv=setInterval(()=>spark(edge,c.y+(Math.random()*30-15)),90); api.cleanup(()=>clearInterval(iv));
        api.later(()=>clearInterval(iv),2200);
        api.later(finishRun,2700);
      } else {
        progress(3400);
        const P=[[.34,.44],[.66,.44],[.34,.76],[.66,.76]];
        P.forEach((p,i)=>{
          const hx=c.x-c.w/2+p[0]*c.w, hy=c.y-c.w/2+p[1]*c.w, tw=tl.offsetWidth, th=tl.offsetHeight;
          api.later(()=>toolAt(hx-tw/2,hy-th*.9-22),i*800+20);
          api.later(()=>toolAt(hx-tw/2,hy-th*.9),i*800+300);
          api.later(()=>{const d=document.createElement('span');d.className='hole';d.style.left=(p[0]*100)+'%';d.style.top=(p[1]*100)+'%';wp.appendChild(d);for(let k=0;k<4;k++)spark(hx,hy)},i*800+520);
          api.later(()=>toolAt(hx-tw/2,hy-th*.9-22),i*800+680);
        });
        api.later(finishRun,4*800+100);
      }
    }
  },
  compare(ph,root,api){
    root.innerHTML=`<div class="cmp" id="cmp"><div class="cl">${ic('pMach')}</div><div class="cl" id="cb" style="clip-path:inset(0 50% 0 0)">${ic('pClean')}</div><div class="cdiv" id="cd" style="left:50%"></div><span class="ctag l">${LH(z('鑄造後','As-cast'))}</span><span class="ctag r">${LH(z('CNC 加工後','After CNC'))}</span></div>
    <input class="rg" id="rg" type="range" min="0" max="100" value="50" aria-label="${L(ph.q)}">
    <div class="chips" id="ft"><span class="chip off">${LH(z('外型','Shape'))}</span><span class="chip off">${LH(z('孔位','Holes'))}</span><span class="chip off">${LH(z('平面與加工面','Machined faces'))}</span></div><div class="cap">${T('slide')}</div>`;
    const rg=$('#rg',root), cb=$('#cb',root), cd=$('#cd',root); let a=false,b=false;
    rg.addEventListener('input',()=>{
      const v=+rg.value; cb.style.clipPath=`inset(0 ${100-v}% 0 0)`; cd.style.left=v+'%';
      if(v>=92) a=true; if(v<=8){b=true; root.querySelectorAll('.chip').forEach(c=>c.classList.remove('off'));}
      if(a&&b){rg.disabled=true;api.done(ph.done);}
    });
  },
  find(ph,root,api){
    const P=[[64,42],[30,66],[58,84]], d=ph.on?P[ph.pos]:null;
    root.innerHTML=`<div class="obj big" id="obj"><div class="ico">${ic(ph.icon)}</div>${d?`<i class="defect" style="left:${d[0]}%;top:${d[1]}%"></i>`:''}</div><div class="cap">${T('findcap')}</div><button class="btn ghost" id="okb">${T('passbtn')}</button>`;
    const obj=$('#obj',root);
    obj.addEventListener('click',e=>{
      if(fin) return;
      const r=obj.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
      if(d&&Math.hypot(x-d[0],y-d[1])<14){obj.insertAdjacentHTML('beforeend',`<i class="ring" style="left:${d[0]}%;top:${d[1]}%"></i>`);$('#okb',root).disabled=true;api.done(ph.doneBad);}
      else api.hint(d?ph.missBad:ph.missOk);
    });
    $('#okb',root).addEventListener('click',()=>{ if(fin) return; if(!d){obj.style.outline='2px solid var(--ok)';api.done(ph.doneOk);} else api.hint(ph.passBad); });
  },
  report(ph,root,api){
    root.innerHTML=`<button class="tapobj" id="t" aria-label="${L(ph.q)}">${ic('clip')}</button><div class="cap">${LH(UI.tapx(1))}</div>`;
    $('#t',root).addEventListener('click',()=>{
      root.innerHTML=`<div class="rep"><span class="sample">${LH(z('示意資料 · 非宏合實際檢驗紀錄','SAMPLE DATA · not an actual HONHO inspection record'))}</span>
      <h4>${LH(z('樣品檢驗報告(示意)','Sample Inspection Report (illustrative)'))}</h4>
      <div class="tw"><table><thead><tr><th>${LH(z('檢驗項目','Item'))}</th><th>${LH(z('圖面值','Nominal'))}</th><th>${LH(z('公差','Tol.'))}</th><th>${LH(z('量測值','Measured'))}</th><th>${LH(z('判定','Result'))}</th></tr></thead>
      <tbody>${ph.rows.map(r=>`<tr><td>${LH(r.i)}</td><td>${r.nom}</td><td>${r.tol}</td><td>${r.v}</td><td class="ok">OK ✓</td></tr>`).join('')}</tbody></table></div>
      <div class="pass">${LH(z('合格 PASS','PASS'))}</div></div>`;
      api.done(ph.done);
    });
  }
};

setLang(lang);
render();
</script>

</body></html>
